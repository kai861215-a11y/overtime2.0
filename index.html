<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加班費Pro</title>

<style>
body { font-family: -apple-system; background:#111; color:#fff; padding:20px;}
input, select, button {
  width:100%; padding:14px; margin:8px 0; font-size:16px;
  border-radius:10px; border:none;
}
button { background:#333; color:#fff;}
.result { font-size:26px; text-align:center; margin-top:15px;}
.small { font-size:14px; color:#aaa; text-align:center;}
button:active { transform:scale(0.95); opacity:0.7;}
</style>
</head>

<body>

<h2>加班費 Pro</h2>

<select id="dayType">
  <option value="work">工作日</option>
  <option value="rest">休息日</option>
  <option value="holiday">國定假日</option>
</select>

<input id="salary" placeholder="月薪 / 半月薪">
<select id="salaryType">
  <option value="month">月薪</option>
  <option value="half">半月薪</option>
</select>

<input id="rate" placeholder="時薪（自動換算）">
<input id="hours" placeholder="加班時數">

<button onclick="calc()">計算</button>

<div class="result" id="result">0 元</div>
<div class="small" id="summary"></div>
<div class="result" id="totalHours">總時數：0 小時</div>
<div class="result" id="totalMoney">總金額：0 元</div>

<button onclick="resetAll()" style="background:#800;">
  初始化（全部歸0）
</button>

<script>

// 載入紀錄
let logs = JSON.parse(localStorage.getItem("logs") || "[]");

// 薪資轉時薪
document.getElementById("salary").addEventListener("input", updateRate);
document.getElementById("salaryType").addEventListener("change", updateRate);

function updateRate(){
  let salary = parseFloat(document.getElementById("salary").value);
  let type = document.getElementById("salaryType").value;

  if(!salary) return;

  if(type === "half"){
    salary = salary * 2;
  }

  let hourly = salary / 240;
  document.getElementById("rate").value = hourly.toFixed(1);
}

// 勞基法倍率
function getMultiplier(dayType, hours){
  if(dayType === "holiday") return 2;

  if(dayType === "work"){
    if(hours <= 2) return 1.33;
    return 1.66;
  }

  if(dayType === "rest"){
    if(hours <= 2) return 1.33;
    if(hours <= 8) return 1.66;
    return 2;
  }
}

// 主計算
function calc(){
  let rate = parseFloat(document.getElementById("rate").value);
  let hours = parseFloat(document.getElementById("hours").value);
  let dayType = document.getElementById("dayType").value;

  if(!rate || !hours){
    document.getElementById("result").innerText = "請輸入數值";
    return;
  }

  let total = 0;

  // ✅ 工作日（分段）
  if(dayType === "work"){
    if(hours <= 2){
      total = rate * hours * 1.34;
    }else if(hours <= 4){
      total = (rate * 2 * 1.34) + (rate * (hours - 2) * 1.67);
    }else{
      total = (rate * 2 * 1.34) + (rate * 2 * 1.67);
    }
  }

  // ✅ 休息日（區間跳級）
  if(dayType === "rest"){
    if(hours > 0 && hours <= 2){
      total = rate * 2 * 1.34;
    }else if(hours <= 8){
      total = rate * 8 * 1.67;
    }else{
      total = rate * 12 * 2.67;
    }
  }

  // ✅ 國定假日
  if(dayType === "holiday"){
    total = rate * hours * 2;
  }

  document.getElementById("result").innerText =
    total.toFixed(0) + " 元";

  saveLog(total);

  let t = getTotals();
  t.hours += hours;
  t.money += total;
  saveTotals(t.hours, t.money);
  updateTotalsUI();
 }  
function resetAll(){
  if(confirm("確定要全部歸0嗎？")){
    localStorage.removeItem("totals");
    localStorage.removeItem("logs");

    updateTotalsUI();
    updateMonthly();

    document.getElementById("result").innerText = "0 元";
  }
}  
// 儲存紀錄
function saveLog(total){
  let logs = JSON.parse(localStorage.getItem("logs") || "[]");

  let now = new Date();
  let month = now.getMonth() + 1;

  logs.push({month, total});
  localStorage.setItem("logs", JSON.stringify(logs));

  updateMonthly();
}

// 每月統計
function updateMonthly(){
  let logs = JSON.parse(localStorage.getItem("logs") || "[]");

  let now = new Date();
  let month = now.getMonth() + 1;

  let sum = logs
    .filter(l => l.month === month)
    .reduce((a,b)=>a+b.total,0);

  document.getElementById("summary").innerText =
    "本月加班總額：" + sum.toFixed(0) + " 元";
}

  function getTotals(){
  return JSON.parse(localStorage.getItem("totals") || '{"hours":0,"money":0}');
}

function saveTotals(hours, money){
  localStorage.setItem("totals", JSON.stringify({hours, money}));
}

// 更新畫面
function updateTotalsUI(){
  let t = getTotals();
  document.getElementById("totalHours").innerText =
    "總時數：" + t.hours.toFixed(1) + " 小時";

  document.getElementById("totalMoney").innerText =
    "總金額：" + t.money.toFixed(0) + " 元";
}
updateTotalsUI();
document.getElementById("totalHours").innerText = "總時數：0 小時";
document.getElementById("totalMoney").innerText = "總金額：0 元";
</script>

</body>
</html>
